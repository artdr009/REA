<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6ef">
  <title>REA Short Drama Studio 실행 안내</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Malgun Gothic", sans-serif; color: #334139; background: #f7f6ef; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(560px, 100%); padding: 32px; border: 1px solid #dfe5d8; border-radius: 18px; background: #fffef9; box-shadow: 0 16px 48px #45524212; }
    .mark { width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 24px; border-radius: 13px; background: #e8efe5; color: #52796b; font-size: 22px; font-weight: 800; }
    h1 { margin: 0 0 12px; font-size: 25px; }
    p { color: #66746a; line-height: 1.7; }
    .launch { margin: 22px 0; padding: 16px; border-radius: 10px; background: #f0f4eb; }
    .launch strong { display: block; margin-bottom: 6px; color: #3c5947; }
    code { color: #456b55; font: 600 13px Consolas, monospace; }
    small { color: #78867b; }
  </style>
</head>
<body>
  <main>
    <div class="mark">R</div>
    <h1>이 브라우저 화면은 예전 버전입니다.</h1>
    <p>최신 REA Short Drama Studio는 브라우저에서 <code>index.html</code>을 여는 방식이 아닙니다.</p>
    <div class="launch">
      <strong>앱을 실행하려면</strong>
      <p>이 창을 닫고 같은 폴더의 <code>실행하기.bat</code>을 더블클릭하세요.</p>
    </div>
    <small>또는 바탕화면 REA 폴더의 「REA 숏드라마 스튜디오」 바로가기를 실행하세요.</small>
  </main>
</body>
</html>
